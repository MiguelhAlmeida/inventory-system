services:
  postgres:
    image: postgres:16

    container_name: inventory_postgres

    restart: always

    environment:
      POSTGRES_USER: miguel
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: inventory_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: